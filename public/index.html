<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Staffordshire Chambers Room Hire</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        font-family: "Work Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f5f5;
        color: #1d1d1b;
        --brand: #e6234a;
        --brand-dark: #b51637;
        --brand-pale: #fde4ea;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: linear-gradient(180deg, #fff 0%, #f8f3f4 100%);
        min-height: 100vh;
        overflow-x: hidden;
        padding-top: 1.5rem;
      }

      main {
        margin: 0 auto 2.5rem;
        max-width: 1100px;
        padding: 0 1rem 3rem;
      }

      .card {
        background: white;
        border-radius: 18px;
        box-shadow: 0 20px 55px rgba(27, 9, 14, 0.08);
        padding: 1.5rem;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        align-items: center;
      }

      .toolbar strong {
        font-size: 1.15rem;
      }

      .toolbar button,
      .toolbar input[type="date"] {
        border: none;
        padding: 0.65rem 1rem;
        border-radius: 999px;
        font-weight: 500;
        cursor: pointer;
        background: #f6e5e9;
      }

      .toolbar .primary {
        background: var(--brand);
        color: white;
      }

      .calendar-shell {
        margin-top: 1.5rem;
      }

      .calendar-scroll {
        overflow-x: hidden;
        background: white;
        border-radius: 18px;
        box-shadow: inset 0 0 0 1px rgba(230, 35, 74, 0.08);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }

      thead th {
        position: sticky;
        top: 0;
        background: #fff5f7;
        padding: 0.75rem;
        font-weight: 600;
        font-size: 0.9rem;
        text-align: left;
      }

      thead th:first-child,
      tbody th {
        width: 70px;
      }

      tbody th {
        background: #fff9fa;
        font-weight: 500;
        font-size: 0.9rem;
        color: var(--brand);
      }

      td {
        min-width: auto;
        width: auto;
        border-top: 1px solid #f0e7ee;
        border-left: 1px solid #f0e7ee;
        padding: 0.15rem 0.25rem;
        height: 38px;
        position: relative;
        vertical-align: top;
      }

      td button.cell-action {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: none;
        background: transparent;
        cursor: pointer;
      }

      .booking-cell {
        padding: 0.25rem 0.25rem;
      }

      .booking-chip {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        border-radius: 12px;
        padding: 0.45rem 0.55rem;
        background: linear-gradient(160deg, var(--brand) 0%, var(--brand-dark) 100%);
        color: white;
        font-weight: 600;
        line-height: 1.2;
        text-align: left;
        box-shadow: 0 10px 24px rgba(230, 35, 74, 0.28);
        border: none;
        cursor: pointer;
      }

      .booking-chip span {
        display: block;
        font-size: 0.95rem;
      }

      .booking-chip small {
        display: block;
        font-size: 0.8rem;
        font-weight: 500;
        opacity: 0.95;
      }

      .empty-slot {
        border: 1px dashed rgba(230, 35, 74, 0.35);
        border-radius: 12px;
        height: 100%;
      }

      #booking-list {
        margin-top: 1.5rem;
      }

      .booking-row {
        padding: 1rem;
        border-bottom: 1px solid #efe1eb;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 0.75rem;
      }

      .booking-meta strong {
        font-size: 1.05rem;
      }

      .booking-meta span {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        margin-right: 1rem;
        font-size: 0.9rem;
      }

      .booking-actions button {
        border: none;
        padding: 0.4rem 0.9rem;
        border-radius: 999px;
        cursor: pointer;
        font-weight: 500;
      }

      .booking-actions .edit {
        background: var(--brand-pale);
        color: var(--brand);
      }

      .booking-actions .delete {
        background: #ffd7dd;
        color: #7f1025;
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(13, 8, 16, 0.55);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        z-index: 20;
      }

      .modal-backdrop.visible {
        display: flex;
      }

      .modal {
        background: white;
        border-radius: 20px;
        width: min(520px, 100%);
        max-height: 90vh;
        overflow-y: auto;
        padding: 1.5rem;
        box-shadow: 0 25px 70px rgba(8, 5, 9, 0.25);
      }

      .modal h2 {
        margin-top: 0;
      }

      form label {
        display: flex;
        flex-direction: column;
        font-size: 0.9rem;
        gap: 0.35rem;
      }

      form input[type="text"],
      form input[type="number"],
      form input[type="datetime-local"],
      form textarea,
      form select {
        border: 1px solid #dfd5db;
        border-radius: 10px;
        padding: 0.5rem 0.65rem;
        font: inherit;
      }

      fieldset {
        border: none;
        padding: 0;
        margin: 0;
      }

      fieldset legend {
        font-weight: 600;
        margin-bottom: 0.5rem;
      }

      .pill-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      .pill-grid label {
        border: 1px solid #d0c6ce;
        border-radius: 999px;
        padding: 0.35rem 0.9rem;
        cursor: pointer;
        flex-direction: row;
        align-items: center;
        gap: 0.35rem;
      }

      .pill-grid input {
        accent-color: var(--brand);
      }

      .form-actions {
        display: flex;
        justify-content: space-between;
        gap: 0.75rem;
        margin-top: 1rem;
        flex-wrap: wrap;
      }

      .form-actions button {
        border: none;
        border-radius: 999px;
        padding: 0.6rem 1.4rem;
        font-weight: 600;
        cursor: pointer;
      }

      .form-actions .danger {
        background: #ffdfe6;
        color: #8c0f2c;
      }

      .form-actions .secondary {
        background: #f3f0f5;
      }

      .form-actions .primary {
        background: var(--brand);
        color: white;
      }

      .error-panel {
        background: #ffe3e3;
        border-radius: 12px;
        padding: 0.75rem 1rem;
        color: #6b0d1f;
        margin-bottom: 1rem;
      }

      @media (max-width: 720px) {
        .toolbar {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <div class="toolbar">
          <button type="button" id="prev-day">Previous</button>
          <strong id="selected-date-label"></strong>
          <button type="button" id="next-day">Next</button>
          <input type="date" id="date-picker" />
          <button type="button" id="today" class="primary">Today</button>
          <button type="button" id="new-booking" class="primary" style="margin-left:auto">New Booking</button>
        </div>
        <div class="calendar-shell">
          <div class="calendar-scroll">
            <table>
              <thead>
                <tr id="calendar-head"></tr>
              </thead>
              <tbody id="calendar-body"></tbody>
            </table>
          </div>
        </div>
      </section>

      <section class="card" id="booking-list">
        <h2>Bookings</h2>
        <div id="booking-rows"></div>
      </section>
    </main>

    <div class="modal-backdrop" id="modal">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:1rem;">
          <h2 id="modal-title">New Booking</h2>
          <button type="button" id="close-modal" aria-label="Close" style="border:none;background:transparent;font-size:1.4rem;cursor:pointer">×</button>
        </div>
        <div id="form-errors" class="error-panel" hidden></div>
        <form id="booking-form">
          <input type="hidden" name="bookingId" />
          <label>
            Company name
            <input type="text" name="companyName" required />
          </label>
          <label>
            Main point of contact
            <input type="text" name="contactName" required />
          </label>
          <label>
            Preferred layout
            <select name="layout">
              <option value="boardroom">Boardroom</option>
              <option value="u-shape">U-Shape</option>
              <option value="theatre">Theatre</option>
            </select>
          </label>
          <fieldset>
            <legend>Rooms</legend>
            <div class="pill-grid" id="room-options"></div>
          </fieldset>
          <label>
            Start time
            <input type="datetime-local" name="startTime" required />
          </label>
          <label>
            End time
            <input type="datetime-local" name="endTime" required />
          </label>
          <label style="flex-direction:row;align-items:center;gap:0.5rem">
            <input type="checkbox" name="refreshments" /> Refreshments required?
          </label>
          <label id="refreshments-details" hidden>
            Refreshments details
            <textarea name="refreshmentsDetails" rows="2"></textarea>
          </label>
          <label style="flex-direction:row;align-items:center;gap:0.5rem">
            <input type="checkbox" name="lunch" /> Lunch required?
          </label>
          <label id="lunch-details" hidden>
            Lunch details
            <textarea name="lunchDetails" rows="2"></textarea>
          </label>
          <fieldset>
            <legend>Equipment</legend>
            <div class="pill-grid">
              <label><input type="checkbox" name="equipment" value="laptop" /> Laptop</label>
              <label><input type="checkbox" name="equipment" value="projector" /> Projector</label>
              <label><input type="checkbox" name="equipment" value="flipchart" /> Flipchart</label>
              <label><input type="checkbox" name="equipment" value="tv" /> TV</label>
            </div>
          </fieldset>
          <label>
            Internal notes
            <textarea name="notes" rows="2"></textarea>
          </label>
          <div class="form-actions">
            <button type="button" class="danger" id="delete-booking" hidden>Delete booking</button>
            <div style="margin-left:auto;display:flex;gap:0.75rem;flex-wrap:wrap;">
              <button type="button" class="secondary" id="cancel-form">Cancel</button>
              <button type="submit" class="primary" id="save-booking">Save booking</button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <script>
      const state = {
        rooms: [],
        bookings: [],
        selectedDate: new Date().toISOString().slice(0, 10)
      };

      const maxBookingDate = "2025-12-31";

      const timeSlots = (() => {
        const slots = [];
        const start = new Date();
        start.setHours(8, 0, 0, 0);
        for (let i = 0; i < 20; i++) {
          const slot = new Date(start.getTime() + i * 30 * 60000);
          slots.push(slot);
        }
        return slots;
      })();

      const modal = document.getElementById("modal");
      const bookingForm = document.getElementById("booking-form");
      const roomOptions = document.getElementById("room-options");
      const bookingRows = document.getElementById("booking-rows");
      const calendarHead = document.getElementById("calendar-head");
      const calendarBody = document.getElementById("calendar-body");
      const selectedDateLabel = document.getElementById("selected-date-label");
      const datePicker = document.getElementById("date-picker");
      const errorPanel = document.getElementById("form-errors");
      const deleteButton = document.getElementById("delete-booking");

      datePicker.max = maxBookingDate;

      const api = {
        async rooms() {
          const res = await fetch("/api/rooms");
          if (!res.ok) throw new Error("Failed to load rooms");
          return res.json();
        },
        async bookings(date) {
          const res = await fetch(`/api/bookings?date=${date}`);
          if (!res.ok) throw new Error("Failed to load bookings");
          return res.json();
        },
        async createBooking(payload) {
          const res = await fetch("/api/bookings", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "Failed to save booking");
          return data;
        },
        async updateBooking(id, payload) {
          const res = await fetch(`/api/bookings/${id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "Failed to update booking");
          return data;
        },
        async deleteBooking(id) {
          const res = await fetch(`/api/bookings/${id}`, { method: "DELETE" });
          if (!res.ok) {
            const data = await res.json().catch(() => ({}));
            throw new Error(data.error || "Failed to delete booking");
          }
        }
      };

      async function loadRooms() {
        const { rooms } = await api.rooms();
        state.rooms = rooms;
        renderRoomPills();
        renderCalendarHead();
      }

      async function loadBookings() {
        const { bookings } = await api.bookings(state.selectedDate);
        state.bookings = bookings;
        renderCalendarBody();
        renderBookingList();
      }

      function renderRoomPills() {
        roomOptions.innerHTML = state.rooms
          .map(
            (room) => `
            <label>
              <input type="checkbox" name="rooms" value="${room.id}" />
              ${room.name}
            </label>`
          )
          .join("");
      }

      function renderCalendarHead() {
        calendarHead.innerHTML = ["<th>Time</th>", ...state.rooms.map((room) => `<th>${room.name}</th>`)].join("");
      }

      function findBooking(roomId, slotTime) {
        return state.bookings.find((booking) => {
          const start = new Date(booking.startTime);
          const end = new Date(booking.endTime);
          return (
            booking.rooms.includes(roomId) &&
            slotTime >= start &&
            slotTime < end
          );
        });
      }

      function renderCalendarBody() {
        calendarBody.innerHTML = "";
        const date = new Date(state.selectedDate + "T00:00:00");
        const spanTracker = {};
        timeSlots.forEach((slot) => {
          const row = document.createElement("tr");
          const timeCell = document.createElement("th");
          const slotDate = new Date(date.getFullYear(), date.getMonth(), date.getDate(), slot.getHours(), slot.getMinutes());
          timeCell.textContent = slotDate.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
          row.appendChild(timeCell);

          state.rooms.forEach((room) => {
            if (spanTracker[room.id] && spanTracker[room.id] > 0) {
              spanTracker[room.id] -= 1;
              return;
            }

            const cell = document.createElement("td");
            const slotStart = new Date(slotDate);
            const booking = findBooking(room.id, slotStart);
            if (booking) {
              const bookingStart = new Date(booking.startTime);
              if (bookingStart.getTime() === slotStart.getTime()) {
                const durationSlots = Math.max(
                  1,
                  Math.round((new Date(booking.endTime) - bookingStart) / (30 * 60000))
                );
                cell.rowSpan = durationSlots;
                cell.classList.add("booking-cell");
                const chip = createBookingChip(booking);
                cell.appendChild(chip);
                spanTracker[room.id] = durationSlots - 1;
              } else {
                const remainingSlots = Math.max(
                  1,
                  Math.round((new Date(booking.endTime) - slotStart) / (30 * 60000))
                );
                cell.rowSpan = remainingSlots;
                cell.classList.add("booking-cell");
                const chip = createBookingChip(booking);
                cell.appendChild(chip);
                spanTracker[room.id] = remainingSlots - 1;
              }
            } else {
              const btn = document.createElement("button");
              btn.type = "button";
              btn.className = "cell-action";
              const wrapper = document.createElement("div");
              wrapper.className = "empty-slot";
              btn.appendChild(wrapper);
              btn.addEventListener("click", () => openModal(null, room.id, slotStart));
              cell.appendChild(btn);
            }

            row.appendChild(cell);
          });
          calendarBody.appendChild(row);
        });
      }

      function createBookingChip(booking) {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "booking-chip";
        chip.innerHTML = `<span>${booking.companyName}</span><small>${booking.contactName}</small>`;
        chip.addEventListener("click", () => openModal(booking));
        return chip;
      }

      function renderBookingList() {
        if (!state.bookings.length) {
          bookingRows.innerHTML = '<p style="margin:0">No bookings for this date.</p>';
          return;
        }

        bookingRows.innerHTML = state.bookings
          .map((booking) => {
            const start = new Date(booking.startTime).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
            const end = new Date(booking.endTime).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
            const roomNames = booking.rooms
              .map((roomId) => state.rooms.find((room) => room.id === roomId)?.name || roomId)
              .join(", ");
            return `
              <div class="booking-row">
                <div class="booking-meta">
                  <strong>${booking.companyName}</strong>
                  <div>${booking.contactName}</div>
                  <div><span>Time:</span> ${start} – ${end}</div>
                  <div><span>Rooms:</span> ${roomNames}</div>
                </div>
                <div class="booking-actions">
                  <button class="edit" data-id="${booking.id}">Edit</button>
                  <button class="delete" data-id="${booking.id}">Delete</button>
                </div>
              </div>`;
          })
          .join("");

        bookingRows.querySelectorAll(".edit").forEach((btn) => {
          btn.addEventListener("click", () => {
            const booking = state.bookings.find((item) => item.id === btn.dataset.id);
            openModal(booking);
          });
        });

        bookingRows.querySelectorAll(".delete").forEach((btn) => {
          btn.addEventListener("click", async () => {
            if (confirm("Delete this booking?")) {
              await api.deleteBooking(btn.dataset.id);
              await loadBookings();
            }
          });
        });
      }

      function openModal(booking = null, roomId = null, slotStart = null) {
        bookingForm.reset();
        errorPanel.hidden = true;
        bookingForm.bookingId.value = booking ? booking.id : "";
        document.getElementById("modal-title").textContent = booking ? "Edit Booking" : "New Booking";

        const startInput = bookingForm.querySelector('[name="startTime"]');
        const endInput = bookingForm.querySelector('[name="endTime"]');

        startInput.max = `${maxBookingDate}T23:59`;
        endInput.max = `${maxBookingDate}T23:59`;

        if (booking) {
          bookingForm.companyName.value = booking.companyName;
          bookingForm.contactName.value = booking.contactName;
          bookingForm.layout.value = booking.layout;
          bookingForm.notes.value = booking.notes || "";
          bookingForm.refreshments.checked = booking.refreshments;
          bookingForm.refreshmentsDetails.value = booking.refreshmentsDetails || "";
          bookingForm.lunch.checked = booking.lunch;
          bookingForm.lunchDetails.value = booking.lunchDetails || "";
          startInput.value = new Date(booking.startTime).toISOString().slice(0, 16);
          endInput.value = new Date(booking.endTime).toISOString().slice(0, 16);
          bookingForm.querySelectorAll('input[name="equipment"]').forEach((input) => {
            input.checked = booking.equipment?.includes(input.value);
          });
          bookingForm.querySelectorAll('input[name="rooms"]').forEach((input) => {
            input.checked = booking.rooms.includes(input.value);
          });
          deleteButton.hidden = false;
          deleteButton.onclick = async () => {
            if (confirm("Delete this booking?")) {
              await api.deleteBooking(booking.id);
              closeModal();
              await loadBookings();
            }
          };
        } else {
          const selectedDate = state.selectedDate;
          const defaultStart = slotStart ? slotStart : new Date(selectedDate + "T08:00");
          const defaultEnd = new Date(defaultStart.getTime() + 60 * 60000);
          startInput.value = new Date(defaultStart).toISOString().slice(0, 16);
          endInput.value = new Date(defaultEnd).toISOString().slice(0, 16);
          bookingForm.querySelectorAll('input[name="equipment"]').forEach((input) => (input.checked = false));
          bookingForm.querySelectorAll('input[name="rooms"]').forEach((input) => {
            input.checked = roomId ? input.value === roomId : false;
          });
          deleteButton.hidden = true;
          deleteButton.onclick = null;
        }

        toggleDetail(bookingForm.refreshments, document.getElementById("refreshments-details"));
        toggleDetail(bookingForm.lunch, document.getElementById("lunch-details"));
        modal.classList.add("visible");
      }

      function closeModal() {
        modal.classList.remove("visible");
      }

      function toggleDetail(checkbox, container) {
        container.hidden = !checkbox.checked;
      }

      bookingForm.refreshments.addEventListener("change", (event) => {
        toggleDetail(event.target, document.getElementById("refreshments-details"));
      });

      bookingForm.lunch.addEventListener("change", (event) => {
        toggleDetail(event.target, document.getElementById("lunch-details"));
      });

      bookingForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const payload = collectFormData();
        try {
          if (bookingForm.bookingId.value) {
            await api.updateBooking(bookingForm.bookingId.value, payload);
          } else {
            await api.createBooking(payload);
          }
          closeModal();
          await loadBookings();
        } catch (error) {
          errorPanel.textContent = error.message;
          errorPanel.hidden = false;
        }
      });

      function collectFormData() {
        const formData = new FormData(bookingForm);
        const rooms = Array.from(bookingForm.querySelectorAll('input[name="rooms"]:checked')).map((input) => input.value);
        const equipment = Array.from(bookingForm.querySelectorAll('input[name="equipment"]:checked')).map((input) => input.value);
        return {
          companyName: formData.get("companyName").trim(),
          contactName: formData.get("contactName").trim(),
          layout: formData.get("layout"),
          rooms,
          startTime: new Date(formData.get("startTime")).toISOString(),
          endTime: new Date(formData.get("endTime")).toISOString(),
          refreshments: bookingForm.refreshments.checked,
          refreshmentsDetails: formData.get("refreshmentsDetails") || "",
          lunch: bookingForm.lunch.checked,
          lunchDetails: formData.get("lunchDetails") || "",
          equipment,
          notes: formData.get("notes") || ""
        };
      }

      document.getElementById("cancel-form").addEventListener("click", closeModal);
      document.getElementById("close-modal").addEventListener("click", closeModal);
      document.getElementById("new-booking").addEventListener("click", () => openModal());

      document.getElementById("prev-day").addEventListener("click", () => changeDay(-1));
      document.getElementById("next-day").addEventListener("click", () => changeDay(1));
      document.getElementById("today").addEventListener("click", () => {
        state.selectedDate = new Date().toISOString().slice(0, 10);
        updateDateUI();
        loadBookings();
      });

      datePicker.addEventListener("change", () => {
        if (datePicker.value) {
          state.selectedDate = datePicker.value;
          updateDateUI();
          loadBookings();
        }
      });

      function changeDay(delta) {
        const current = new Date(state.selectedDate + "T00:00:00");
        current.setDate(current.getDate() + delta);
        state.selectedDate = current.toISOString().slice(0, 10);
        updateDateUI();
        loadBookings();
      }

      function updateDateUI() {
        const date = new Date(state.selectedDate + "T00:00:00");
        const formatter = new Intl.DateTimeFormat(undefined, { weekday: "long", day: "numeric", month: "long", year: "numeric" });
        selectedDateLabel.textContent = formatter.format(date);
        datePicker.value = state.selectedDate;
      }

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closeModal();
        }
      });

      async function bootstrap() {
        updateDateUI();
        await loadRooms();
        await loadBookings();
      }

      bootstrap();
    </script>
  </body>
</html>
