<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Staffordshire Chambers Room Hire</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Montserrat", "Segoe UI", sans-serif;
      color: #1b1f3b;
      background-color: #f5f6f8;
      line-height: 1.5;
      --brand-crimson: #c8102e;
      --brand-navy: #1b1f3b;
      --brand-neutral: #f0f2f7;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #ffffff 0%, #f5f6f8 55%, #e3e7ef 100%);
      overflow-x: hidden;
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 2rem 1.5rem 3rem;
      display: grid;
      gap: 1.5rem;
    }

    h1 {
      margin: 0;
      color: var(--brand-navy);
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 999px;
      font: inherit;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(27, 31, 59, 0.12);
    }

    .btn-primary {
      background: var(--brand-crimson);
      color: #fff;
      padding: 0.7rem 1.5rem;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .btn-secondary {
      background: #ffffff;
      color: var(--brand-navy);
      padding: 0.6rem 1.2rem;
      border: 1px solid rgba(27, 31, 59, 0.12);
    }

    .btn-danger {
      background: #a0001c;
      color: #fff;
      padding: 0.6rem 1.2rem;
    }

    .surface {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 12px 34px rgba(27, 31, 59, 0.08);
      padding: 1.5rem;
      border: 1px solid rgba(27, 31, 59, 0.05);
    }

    #calendar.surface {
      background: transparent;
      box-shadow: none;
      padding: 0;
      border: none;
    }

    body.modal-open {
      overflow: hidden;
    }

    .modal {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
    }

    .modal-content {
      position: relative;
      max-height: 90vh;
      overflow-y: auto;
      width: min(620px, 92vw);
      z-index: 1001;
    }

    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: transparent;
      color: #475569;
      font-size: 1.4rem;
      line-height: 1;
      padding: 0.2rem;
    }

    .modal-close:hover {
      transform: none;
      box-shadow: none;
    }

    #app-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      border-left: 6px solid var(--brand-crimson);
      background: linear-gradient(135deg, rgba(200, 16, 46, 0.06), rgba(27, 31, 59, 0.05));
    }

    #date-navigator {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      background: var(--brand-navy);
      color: #f8fafc;
      border-radius: 16px;
      padding: 1rem 1.35rem;
      box-shadow: inset 0 0 0 1px rgba(248, 250, 252, 0.08);
    }

    #date-navigator strong {
      font-size: 1.05rem;
      min-width: 230px;
    }

    #date-navigator button {
      padding: 0.6rem 1.1rem;
      background: rgba(248, 250, 252, 0.12);
      color: inherit;
      border: 1px solid rgba(248, 250, 252, 0.28);
    }

    #date-navigator button.btn-primary {
      background: var(--brand-crimson);
      color: #fff;
      border: none;
    }

    #date-navigator input[type="date"] {
      font: inherit;
      padding: 0.45rem 0.8rem;
      border-radius: 999px;
      border: none;
      background: rgba(248, 250, 252, 0.12);
      color: inherit;
    }

    table {
      border-collapse: collapse;
      width: max-content;
      min-width: 100%;
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 45px rgba(27, 31, 59, 0.12);
      table-layout: fixed;
    }

    th,
    td {
      border: 1px solid #e0e3ec;
      padding: 0.45rem 0.55rem;
      text-align: left;
      height: 3.2rem;
      vertical-align: middle;
    }

    thead th {
      background: linear-gradient(180deg, rgba(27, 31, 59, 0.07) 0%, rgba(200, 16, 46, 0.08) 100%);
      color: var(--brand-navy);
      position: sticky;
      top: 0;
      z-index: 1;
      font-size: 0.88rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    thead th:first-child,
    tbody td.time-cell {
      width: 82px;
    }

    tbody td.time-cell {
      position: sticky;
      left: 0;
      background: linear-gradient(180deg, #f7f7fb 0%, #ebeef5 100%);
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--brand-navy);
    }

    .booking-cell {
      min-width: 128px;
      max-width: 136px;
      background: transparent;
      cursor: default;
      position: relative;
      transition: background 0.2s ease;
    }

    .booking-cell.active {
      background: rgba(200, 16, 46, 0.12);
      cursor: pointer;
    }

    .booking-cell.available {
      cursor: pointer;
      background: rgba(27, 31, 59, 0.02);
    }

    .booking-cell.available:hover {
      background: rgba(200, 16, 46, 0.08);
    }

    .booking-cell .empty-slot {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.75rem;
      height: 1.75rem;
      border-radius: 999px;
      background: rgba(200, 16, 46, 0.12);
      color: var(--brand-crimson);
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .booking-cell.available:hover .empty-slot,
    .booking-cell.available:focus-within .empty-slot {
      opacity: 1;
    }

    .booking-chip {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      background: rgba(200, 16, 46, 0.16);
      border-radius: 10px;
      padding: 0.35rem 0.5rem;
      min-height: 0;
      overflow: hidden;
    }

    .booking-chip strong {
      font-size: 0.82rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--brand-navy);
    }

    .booking-chip .chip-attendees {
      font-size: 0.74rem;
      color: rgba(27, 31, 59, 0.85);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #calendar {
      overflow: hidden;
    }

    .calendar-scroll {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 0.75rem;
      margin: 0;
    }

    .calendar-scroll::-webkit-scrollbar {
      height: 8px;
    }

    .calendar-scroll::-webkit-scrollbar-thumb {
      background: rgba(27, 31, 59, 0.25);
      border-radius: 999px;
    }

    form label {
      display: grid;
      gap: 0.35rem;
      font-weight: 600;
    }

    input[type="text"],
    input[type="number"],
    input[type="datetime-local"],
    textarea,
    select {
      font: inherit;
      padding: 0.6rem 0.75rem;
      border-radius: 10px;
      border: 1px solid rgba(27, 31, 59, 0.12);
      background: #fff;
    }

    textarea {
      resize: vertical;
      min-height: 70px;
    }

    fieldset {
      border: 1px solid rgba(27, 31, 59, 0.12);
      border-radius: 12px;
      padding: 0.85rem 1.1rem;
      display: grid;
      gap: 0.6rem;
    }

    fieldset legend {
      font-weight: 700;
      padding: 0 0.25rem;
      color: var(--brand-navy);
    }

    .pill-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .pill {
      border: 1px solid rgba(27, 31, 59, 0.18);
      border-radius: 999px;
      padding: 0.4rem 0.85rem;
      background: #fff;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .pill.active {
      background: var(--brand-crimson);
      color: #fff;
      border-color: transparent;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    .hidden {
      display: none !important;
    }

    #form-errors {
      background: rgba(200, 16, 46, 0.1);
      color: #6d0013;
      border-radius: 10px;
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
    }

    #booking-list ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 1rem;
    }

    #booking-list li {
      border: 1px solid rgba(27, 31, 59, 0.08);
      border-radius: 16px;
      padding: 1.1rem;
      display: grid;
      gap: 0.5rem;
      background: linear-gradient(135deg, rgba(200, 16, 46, 0.08), rgba(27, 31, 59, 0.05));
    }

    #booking-list strong {
      color: var(--brand-crimson);
      font-size: 1rem;
      letter-spacing: 0.01em;
    }

    @media (max-width: 1024px) {
      .calendar-scroll table {
        min-width: 760px;
      }
    }

    @media (max-width: 768px) {
      main {
        padding: 1.75rem 1rem 2.5rem;
      }

      #app-header {
        flex-direction: column;
        align-items: flex-start;
      }

      #date-navigator {
        flex-direction: column;
        align-items: stretch;
      }

      #date-navigator strong {
        min-width: auto;
        text-align: center;
      }

      table {
        font-size: 0.85rem;
      }

      thead th:first-child,
      tbody td.time-cell {
        width: 70px;
      }
    }

    @media (max-width: 600px) {
      main {
        padding: 1.5rem 0.75rem 2rem;
      }

      .calendar-scroll table {
        min-width: 560px;
      }

      #booking-list li {
        padding: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <header id="app-header" class="surface">
      <div>
        <h1>Room Hire Calendar</h1>
        <p>Plan Staffordshire Chambers room bookings in convenient 30-minute slots.</p>
      </div>
      <button id="toggle-form" class="btn-primary">New Booking</button>
    </header>

    <section id="date-navigator" class="surface">
      <button data-action="prev">Previous</button>
      <strong id="selected-date-label"></strong>
      <button data-action="next">Next</button>
      <input type="date" id="date-picker" />
      <button data-action="today" class="btn-primary" style="margin-left:auto;">Today</button>
    </section>

    <section id="calendar" class="surface"></section>

    <section id="booking-list" class="surface"></section>
  </main>

  <div
    id="booking-modal"
    class="modal hidden"
    role="dialog"
    aria-modal="true"
    aria-labelledby="form-title"
  >
    <div class="modal-backdrop" data-dismiss="modal"></div>
    <div class="modal-content surface">
      <button type="button" class="modal-close" id="close-modal" aria-label="Close booking form">&times;</button>
      <h2 id="form-title">Create Booking</h2>
      <div id="form-errors" class="hidden"></div>
      <form id="booking-form">
        <div class="form-grid" style="display:grid;gap:1rem;">
          <label>
            Company name
            <input type="text" name="companyName" required />
          </label>
          <label>
            Main point of contact
            <input type="text" name="mainContact" required />
          </label>
          <label>
            Number of attendees
            <input type="number" name="attendeeCount" min="1" value="1" required />
          </label>
          <label>
            Layout
            <select name="layout">
              <option value="boardroom">Boardroom</option>
              <option value="u-shape">U-Shape</option>
              <option value="theatre">Theatre</option>
            </select>
          </label>

          <fieldset>
            <legend>Rooms</legend>
            <div id="room-options" class="pill-group"></div>
          </fieldset>

          <label>
            Start time
            <input type="datetime-local" name="startTime" required />
          </label>
          <label>
            End time
            <input type="datetime-local" name="endTime" required />
          </label>

          <label style="display:flex;align-items:center;gap:0.5rem;font-weight:600;">
            <input type="checkbox" name="refreshments" />
            Refreshments required?
          </label>
          <label id="refreshments-details" class="hidden">
            Refreshments details
            <textarea name="refreshmentsDetails"></textarea>
          </label>

          <label style="display:flex;align-items:center;gap:0.5rem;font-weight:600;">
            <input type="checkbox" name="lunch" />
            Lunch required?
          </label>
          <label id="lunch-details" class="hidden">
            Lunch details
            <textarea name="lunchDetails"></textarea>
          </label>

          <fieldset>
            <legend>Equipment</legend>
            <div id="equipment-options" class="pill-group"></div>
          </fieldset>
        </div>

        <div style="display:flex;justify-content:flex-end;gap:0.75rem;margin-top:1rem;">
          <button type="button" id="cancel-form" class="btn-secondary">Cancel</button>
          <button type="submit" class="btn-primary">Save Booking</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    const rooms = [
      { id: 1, name: "Room 1", capacity: 20, defaultLayout: "boardroom" },
      { id: 2, name: "Room 2", capacity: 25, defaultLayout: "boardroom" },
      { id: 3, name: "Room 3", capacity: 30, defaultLayout: "theatre" },
      { id: 4, name: "Room 4", capacity: 30, defaultLayout: "theatre" },
      { id: 5, name: "The Pod", capacity: 8, defaultLayout: "u-shape" },
      { id: 6, name: "Boardroom", capacity: 12, defaultLayout: "boardroom" },
      { id: 7, name: "Members Lounge Room", capacity: 40, defaultLayout: "theatre" }
    ];

    const equipmentCatalog = [
      { value: "laptop", label: "Laptop" },
      { value: "projector", label: "Projector" },
      { value: "flipchart", label: "Flipchart" }
    ];

    const today = new Date();
    let bookingSequence = 3;
    let selectedDate = formatDateInput(today);
    let editingBookingId = null;

    let bookings = [
      {
        id: 1,
        companyName: "Cooper Consulting",
        mainContact: "Jane Cooper",
        attendeeCount: 14,
        layout: "boardroom",
        refreshments: true,
        refreshmentsDetails: "Tea, coffee, biscuits",
        lunch: false,
        lunchDetails: "",
        equipment: ["projector"],
        rooms: [1, 6],
        startTime: combineDateTime(selectedDate, "09:00"),
        endTime: combineDateTime(selectedDate, "11:30")
      },
      {
        id: 2,
        companyName: "Fox Media Ltd",
        mainContact: "Gary Fox",
        attendeeCount: 22,
        layout: "theatre",
        refreshments: true,
        refreshmentsDetails: "Tea urn",
        lunch: true,
        lunchDetails: "Sandwich platter",
        equipment: ["flipchart"],
        rooms: [3],
        startTime: combineDateTime(selectedDate, "13:00"),
        endTime: combineDateTime(selectedDate, "15:30")
      }
    ];

    const toggleFormBtn = document.querySelector("#toggle-form");
    const bookingModal = document.querySelector("#booking-modal");
    const modalCloseBtn = document.querySelector("#close-modal");
    const modalBackdrop = bookingModal.querySelector(".modal-backdrop");
    const formTitle = document.querySelector("#form-title");
    const bookingForm = document.querySelector("#booking-form");
    const formErrors = document.querySelector("#form-errors");
    const cancelFormBtn = document.querySelector("#cancel-form");
    const roomOptions = document.querySelector("#room-options");
    const equipmentOptions = document.querySelector("#equipment-options");
    const dateLabel = document.querySelector("#selected-date-label");
    const datePicker = document.querySelector("#date-picker");
    const dateNavigator = document.querySelector("#date-navigator");
    const calendar = document.querySelector("#calendar");
    const bookingList = document.querySelector("#booking-list");

    equipmentCatalog.forEach((item) => {
      const pill = document.createElement("label");
      pill.className = "pill";
      pill.dataset.value = item.value;
      pill.innerHTML = `<input type="checkbox" class="visually-hidden" value="${item.value}" />${item.label}`;
      equipmentOptions.appendChild(pill);
    });

    rooms.forEach((room) => {
      const pill = document.createElement("label");
      pill.className = "pill";
      pill.dataset.value = room.id;
      pill.innerHTML = `<input type="checkbox" class="visually-hidden" value="${room.id}" />${room.name}`;
      roomOptions.appendChild(pill);
    });

    const refreshCheckbox = bookingForm.querySelector('input[name="refreshments"]');
    const lunchCheckbox = bookingForm.querySelector('input[name="lunch"]');
    const refreshmentsDetails = document.querySelector("#refreshments-details");
    const lunchDetails = document.querySelector("#lunch-details");

    refreshCheckbox.addEventListener("change", () => {
      refreshmentsDetails.classList.toggle("hidden", !refreshCheckbox.checked);
      if (!refreshCheckbox.checked) {
        bookingForm.refreshmentsDetails.value = "";
      }
    });

    lunchCheckbox.addEventListener("change", () => {
      lunchDetails.classList.toggle("hidden", !lunchCheckbox.checked);
      if (!lunchCheckbox.checked) {
        bookingForm.lunchDetails.value = "";
      }
    });

    toggleFormBtn.addEventListener("click", () => {
      startCreateFlow();
    });

    cancelFormBtn.addEventListener("click", () => {
      closeForm();
    });

    modalCloseBtn.addEventListener("click", () => {
      closeForm();
    });

    modalBackdrop.addEventListener("click", () => {
      closeForm();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !bookingModal.classList.contains("hidden")) {
        closeForm();
      }
    });

    bookingForm.addEventListener("submit", (event) => {
      event.preventDefault();
      handleSubmit();
    });

    dateNavigator.addEventListener("click", (event) => {
      const action = event.target.dataset.action;
      if (!action) return;

      const current = new Date(selectedDate + "T00:00");
      if (action === "prev") {
        current.setDate(current.getDate() - 1);
      } else if (action === "next") {
        current.setDate(current.getDate() + 1);
      } else if (action === "today") {
        current.setTime(today.getTime());
      }
      selectedDate = formatDateInput(current);
      render();
    });

    datePicker.addEventListener("change", () => {
      if (datePicker.value) {
        selectedDate = datePicker.value;
        render();
      }
    });

    function render() {
      dateLabel.textContent = formatHumanDate(selectedDate);
      datePicker.value = selectedDate;
      renderCalendar();
      renderBookingList();
    }

    function renderCalendar() {
      const relevantBookings = bookings.filter((booking) => isSameDay(booking.startTime, selectedDate));
      relevantBookings.sort((a, b) => new Date(a.startTime) - new Date(b.startTime));
      const slots = generateTimeSlots();
      const table = document.createElement("table");

      const thead = document.createElement("thead");
      const headRow = document.createElement("tr");
      const timeHeader = document.createElement("th");
      timeHeader.textContent = "Time";
      headRow.appendChild(timeHeader);
      rooms.forEach((room) => {
        const th = document.createElement("th");
        th.textContent = room.name;
        headRow.appendChild(th);
      });
      thead.appendChild(headRow);

      const tbody = document.createElement("tbody");
      slots.forEach((slot) => {
        const row = document.createElement("tr");
        const timeCell = document.createElement("td");
        timeCell.textContent = slot.label;
        timeCell.className = "time-cell";
        row.appendChild(timeCell);

        rooms.forEach((room) => {
          const cell = document.createElement("td");
          cell.className = "booking-cell";
          const booking = findBookingForCell(relevantBookings, room.id, slot.start);
          if (booking) {
            cell.classList.add("active");
            if (isSameMinute(booking.startTime, slot.start)) {
              cell.innerHTML = `
                <div class="booking-chip">
                  <strong>${booking.companyName}</strong>
                  <div class="chip-attendees">${booking.attendeeCount} attendee${
                    booking.attendeeCount === 1 ? "" : "s"
                  }</div>
                </div>
              `;
            }
            cell.addEventListener("click", () => {
              startEditFlow(booking);
            });
            cell.tabIndex = 0;
            cell.setAttribute(
              "aria-label",
              `View booking for ${booking.companyName} (contact ${booking.mainContact}) in ${room.name} starting ${formatTime(booking.startTime)}`
            );
            cell.addEventListener("keydown", (event) => {
              if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                startEditFlow(booking);
              }
            });
          } else {
            cell.classList.add("available");
            cell.title = `Add booking for ${room.name} at ${slot.label}`;
            const prompt = document.createElement("span");
            prompt.className = "empty-slot";
            prompt.textContent = "+";
            prompt.setAttribute("aria-hidden", "true");
            cell.appendChild(prompt);
            cell.tabIndex = 0;
            cell.setAttribute(
              "aria-label",
              `Add booking for ${room.name} starting ${slot.label}`
            );
            const openCreate = () => {
              startCreateFlow({ roomId: room.id, startTime: slot.start });
            };
            cell.addEventListener("click", openCreate);
            cell.addEventListener("keydown", (event) => {
              if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                openCreate();
              }
            });
          }
          row.appendChild(cell);
        });

        tbody.appendChild(row);
      });

      table.appendChild(thead);
      table.appendChild(tbody);
      const scrollContainer = document.createElement("div");
      scrollContainer.className = "calendar-scroll";
      scrollContainer.appendChild(table);
      calendar.innerHTML = "";
      calendar.appendChild(scrollContainer);
    }

    function renderBookingList() {
      const relevantBookings = bookings
        .filter((booking) => isSameDay(booking.startTime, selectedDate))
        .sort((a, b) => new Date(a.startTime) - new Date(b.startTime));

      if (relevantBookings.length === 0) {
        bookingList.innerHTML = `<h2>Bookings</h2><p>No bookings for this day.</p>`;
        return;
      }

      const list = document.createElement("ul");
      relevantBookings.forEach((booking) => {
        const li = document.createElement("li");
        li.innerHTML = `
          <div>
            <strong>${booking.companyName}</strong><br />
            <span>Main contact: ${booking.mainContact}</span><br />
            ${booking.attendeeCount} attendee${booking.attendeeCount === 1 ? "" : "s"}<br />
            ${formatTime(booking.startTime)} - ${formatTime(booking.endTime)}
          </div>
          <div>Rooms: ${booking.rooms.map((id) => rooms.find((r) => r.id === id)?.name).join(", ")}</div>
          <div>Layout: ${capitalize(booking.layout)}</div>
          ${booking.refreshments ? `<div>Refreshments: ${booking.refreshmentsDetails || "Yes"}</div>` : ""}
          ${booking.lunch ? `<div>Lunch: ${booking.lunchDetails || "Yes"}</div>` : ""}
          ${booking.equipment.length ? `<div>Equipment: ${booking.equipment.map(capitalize).join(", ")}</div>` : ""}
          <div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-top:0.75rem;">
            <button class="btn-secondary" data-action="edit" data-id="${booking.id}">Edit</button>
            <button class="btn-danger" data-action="delete" data-id="${booking.id}">Delete</button>
          </div>
        `;
        list.appendChild(li);
      });

      bookingList.innerHTML = "";
      const heading = document.createElement("h2");
      heading.textContent = "Bookings";
      bookingList.appendChild(heading);
      bookingList.appendChild(list);

      bookingList.querySelectorAll('button[data-action="edit"]').forEach((btn) => {
        btn.addEventListener("click", () => {
          const booking = bookings.find((b) => b.id === Number(btn.dataset.id));
          if (booking) startEditFlow(booking);
        });
      });

      bookingList.querySelectorAll('button[data-action="delete"]').forEach((btn) => {
        btn.addEventListener("click", () => {
          const bookingId = Number(btn.dataset.id);
          const booking = bookings.find((b) => b.id === bookingId);
          if (booking && confirm(`Delete booking for ${booking.companyName}?`)) {
            bookings = bookings.filter((b) => b.id !== bookingId);
            if (editingBookingId === bookingId) {
              closeForm();
            }
            render();
          }
        });
      });
    }

    function startCreateFlow(preset = {}) {
      editingBookingId = null;
      formTitle.textContent = "Create Booking";
      formErrors.classList.add("hidden");
      formErrors.innerHTML = "";
      bookingForm.reset();
      clearSelections();
      refreshmentsDetails.classList.add("hidden");
      lunchDetails.classList.add("hidden");

      const fallbackStart = new Date(selectedDate + "T09:00");
      let start = preset.startTime ? new Date(preset.startTime) : fallbackStart;
      if (Number.isNaN(start.getTime())) {
        start = fallbackStart;
      }
      const durationMinutes = preset.durationMinutes ?? 60;
      const end = new Date(start.getTime() + durationMinutes * 60 * 1000);
      const latestAllowed = new Date(selectedDate + "T20:00");
      if (end > latestAllowed) {
        end.setTime(latestAllowed.getTime());
      }

      bookingForm.companyName.value = preset.companyName ?? "";
      bookingForm.mainContact.value = preset.mainContact ?? "";
      bookingForm.attendeeCount.value = preset.attendeeCount ?? 1;
      bookingForm.layout.value = preset.layout ?? "boardroom";
      bookingForm.startTime.value = toLocalInputValue(start);
      bookingForm.endTime.value = toLocalInputValue(end);

      setCheckboxSelections(roomOptions, preset.roomId ? [String(preset.roomId)] : []);
      setCheckboxSelections(equipmentOptions, preset.equipment ?? []);

      document.body.classList.add("modal-open");
      bookingModal.classList.remove("hidden");
      setTimeout(() => {
        bookingForm.companyName.focus();
      }, 0);
    }

    function startEditFlow(booking) {
      editingBookingId = booking.id;
      formTitle.textContent = "Edit Booking";
      formErrors.classList.add("hidden");
      formErrors.innerHTML = "";
      bookingForm.reset();
      clearSelections();
      refreshmentsDetails.classList.add("hidden");
      lunchDetails.classList.add("hidden");
      document.body.classList.add("modal-open");
      bookingModal.classList.remove("hidden");
      populateForm(booking);
      setTimeout(() => {
        bookingForm.companyName.focus();
      }, 0);
    }

    function closeForm() {
      bookingModal.classList.add("hidden");
      document.body.classList.remove("modal-open");
      editingBookingId = null;
      bookingForm.reset();
      clearSelections();
      refreshmentsDetails.classList.add("hidden");
      lunchDetails.classList.add("hidden");
      formErrors.classList.add("hidden");
      formErrors.innerHTML = "";
    }

    function populateForm(booking) {
      bookingForm.companyName.value = booking.companyName;
      bookingForm.mainContact.value = booking.mainContact;
      bookingForm.attendeeCount.value = booking.attendeeCount;
      bookingForm.layout.value = booking.layout;

      setCheckboxSelections(roomOptions, booking.rooms.map(String));
      setCheckboxSelections(equipmentOptions, booking.equipment);

      bookingForm.startTime.value = toLocalInputValue(booking.startTime);
      bookingForm.endTime.value = toLocalInputValue(booking.endTime);

      bookingForm.refreshments.checked = booking.refreshments;
      refreshmentsDetails.classList.toggle("hidden", !booking.refreshments);
      bookingForm.refreshmentsDetails.value = booking.refreshmentsDetails || "";

      bookingForm.lunch.checked = booking.lunch;
      lunchDetails.classList.toggle("hidden", !booking.lunch);
      bookingForm.lunchDetails.value = booking.lunchDetails || "";
    }

    function clearSelections() {
      roomOptions.querySelectorAll("input").forEach((input) => {
        input.checked = false;
        input.parentElement.classList.remove("active");
      });
      equipmentOptions.querySelectorAll("input").forEach((input) => {
        input.checked = false;
        input.parentElement.classList.remove("active");
      });
    }

    function setCheckboxSelections(container, values) {
      container.querySelectorAll("input").forEach((input) => {
        const isSelected = values.includes(input.value);
        input.checked = isSelected;
        input.parentElement.classList.toggle("active", isSelected);
      });
    }

    roomOptions.addEventListener("click", (event) => {
      const label = event.target.closest("label");
      if (!label) return;
      const input = label.querySelector("input");
      input.checked = !input.checked;
      label.classList.toggle("active", input.checked);
    });

    equipmentOptions.addEventListener("click", (event) => {
      const label = event.target.closest("label");
      if (!label) return;
      const input = label.querySelector("input");
      input.checked = !input.checked;
      label.classList.toggle("active", input.checked);
    });

    function handleSubmit() {
      const formData = new FormData(bookingForm);
      const payload = {
        companyName: formData.get("companyName").trim(),
        mainContact: formData.get("mainContact").trim(),
        attendeeCount: Number(formData.get("attendeeCount")),
        layout: formData.get("layout"),
        refreshments: formData.get("refreshments") === "on",
        refreshmentsDetails: formData.get("refreshmentsDetails")?.trim() || "",
        lunch: formData.get("lunch") === "on",
        lunchDetails: formData.get("lunchDetails")?.trim() || "",
        equipment: getCheckedValues(equipmentOptions),
        rooms: getCheckedValues(roomOptions).map(Number),
        startTime: formData.get("startTime"),
        endTime: formData.get("endTime")
      };

      const errors = validateBooking(payload);
      if (errors.length) {
        showErrors(errors);
        return;
      }

      if (editingBookingId) {
        payload.id = editingBookingId;
        bookings = bookings.map((booking) => (booking.id === editingBookingId ? { ...booking, ...payload } : booking));
      } else {
        payload.id = bookingSequence++;
        bookings.push(payload);
      }

      closeForm();
      render();
    }

    function validateBooking(booking) {
      const issues = [];
      if (!booking.companyName || booking.companyName.length < 2) {
        issues.push("Company name must be at least 2 characters long.");
      }
      if (!booking.mainContact || booking.mainContact.length < 2) {
        issues.push("Main point of contact must be at least 2 characters long.");
      }
      if (!Number.isFinite(booking.attendeeCount) || booking.attendeeCount < 1) {
        issues.push("Attendee count must be a positive number.");
      }
      if (!booking.rooms.length) {
        issues.push("Select at least one room.");
      }

      const start = new Date(booking.startTime);
      const end = new Date(booking.endTime);
      if (!isFinite(start) || !isFinite(end)) {
        issues.push("Start and end time must be valid.");
      } else {
        if (end <= start) {
          issues.push("End time must be after start time.");
        }
        if (!isHalfHourIncrement(start) || !isHalfHourIncrement(end)) {
          issues.push("Bookings must start and end on a 30-minute boundary.");
        }
        if (!isMultipleOfHalfHour(start, end)) {
          issues.push("Booking duration must be in 30-minute increments.");
        }
        if (!isSameDay(booking.startTime, booking.endTime)) {
          issues.push("Booking must start and end on the same day.");
        }
        if (formatDateInput(start) !== selectedDate) {
          issues.push("Booking must fall on the selected day.");
        }
      }

      const conflicting = findConflicts(booking, editingBookingId);
      if (conflicting.length) {
        issues.push(`Conflicts with existing booking(s) in: ${conflicting.join(", ")}.`);
      }

      return issues;
    }

    function showErrors(errors) {
      formErrors.innerHTML = `<strong>Please fix the following:</strong><ul>${errors
        .map((error) => `<li>${error}</li>`)
        .join("")}</ul>`;
      formErrors.classList.remove("hidden");
    }

    function findConflicts(booking, excludeId) {
      const start = new Date(booking.startTime);
      const end = new Date(booking.endTime);
      const conflicts = new Set();

      bookings.forEach((existing) => {
        if (excludeId && existing.id === excludeId) return;
        if (!isSameDay(existing.startTime, booking.startTime)) return;

        const existingStart = new Date(existing.startTime);
        const existingEnd = new Date(existing.endTime);
        const overlaps = existingStart < end && existingEnd > start;
        if (!overlaps) return;

        existing.rooms.forEach((roomId) => {
          if (booking.rooms.includes(roomId)) {
            conflicts.add(rooms.find((room) => room.id === roomId)?.name || `Room ${roomId}`);
          }
        });
      });

      return Array.from(conflicts);
    }

    function getCheckedValues(container) {
      return Array.from(container.querySelectorAll("input:checked")).map((input) => input.value);
    }

    function generateTimeSlots() {
      const slots = [];
      const start = new Date(selectedDate + "T08:00");
      const end = new Date(selectedDate + "T18:00");
      let current = new Date(start);
      while (current < end) {
        slots.push({
          start: new Date(current),
          label: formatTime(current)
        });
        current = new Date(current.getTime() + 30 * 60 * 1000);
      }
      return slots;
    }

    function findBookingForCell(bookingsForDay, roomId, slotStart) {
      return bookingsForDay.find((booking) => {
        if (!booking.rooms.includes(roomId)) return false;
        const start = new Date(booking.startTime);
        const end = new Date(booking.endTime);
        return start <= slotStart && end > slotStart;
      });
    }

    function isSameMinute(dateLike, compareLike) {
      const a = new Date(dateLike);
      const b = new Date(compareLike);
      return (
        a.getFullYear() === b.getFullYear() &&
        a.getMonth() === b.getMonth() &&
        a.getDate() === b.getDate() &&
        a.getHours() === b.getHours() &&
        a.getMinutes() === b.getMinutes()
      );
    }

    function isHalfHourIncrement(date) {
      const minutes = date.getMinutes();
      return minutes === 0 || minutes === 30;
    }

    function isMultipleOfHalfHour(start, end) {
      const diff = end.getTime() - start.getTime();
      return diff % (30 * 60 * 1000) === 0;
    }

    function isSameDay(startLike, endLike) {
      const a = new Date(startLike);
      const b = new Date(endLike);
      return (
        a.getFullYear() === b.getFullYear() &&
        a.getMonth() === b.getMonth() &&
        a.getDate() === b.getDate()
      );
    }

    function formatTime(dateLike) {
      const date = new Date(dateLike);
      return date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
    }

    function formatHumanDate(dateInput) {
      const date = new Date(dateInput + "T00:00");
      return date.toLocaleDateString(undefined, {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
      });
    }

    function formatDateInput(dateLike) {
      const date = new Date(dateLike);
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function toLocalInputValue(dateLike) {
      const date = new Date(dateLike);
      const yyyy = date.getFullYear();
      const mm = String(date.getMonth() + 1).padStart(2, "0");
      const dd = String(date.getDate()).padStart(2, "0");
      const hh = String(date.getHours()).padStart(2, "0");
      const mi = String(date.getMinutes()).padStart(2, "0");
      return `${yyyy}-${mm}-${dd}T${hh}:${mi}`;
    }

    function combineDateTime(dateInput, timeString) {
      return `${dateInput}T${timeString}`;
    }

    function capitalize(value) {
      return value ? value.charAt(0).toUpperCase() + value.slice(1) : "";
    }

    render();
  </script>
</body>
</html>
